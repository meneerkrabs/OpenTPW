name: Browser determinism
# The cross-runtime determinism gate (docs/DETERMINISM.md, "Browser and native"; co-op lockstep needs the browser and the desktop to compute
# the same simulation bits): the asset-free unit tests that pin simulation digests run inside the browser build, in headless and muted
# Chrome, against the constants the desktop test runs assert. The AOT leg compiles like the published page (Mono AOT); the interpreter leg
# like a local publish. A separate workflow, so the AOT publish (about 15 minutes on ubuntu-latest) runs beside the main build instead of after it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      particle_render_oracle:
        description: "Run strict particle framebuffer diagnostic (unfixed baseline is expected to fail)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: browser-determinism-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Classify the complete pull request changeset
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci_change_scope.py
  pins:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        runtime: [aot, interpreter]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - name: Install the WebAssembly tools (AOT)
        if: matrix.runtime == 'aot'
        run: dotnet workload install wasm-tools
      - name: Publish the browser build with the pin tests
        run: dotnet publish source/OpenTPW.Web/OpenTPW.Web.csproj -c Release -p:RunAOTCompilation=${{ matrix.runtime == 'aot' }} -p:OpenTpwDeterminismPins=true -o "$RUNNER_TEMP/web" --nologo
      - name: Run the pins in headless Chrome
        run: node --experimental-websocket tools/web-determinism/run.mjs "$RUNNER_TEMP/web/wwwroot" --chrome /usr/bin/google-chrome --report "$RUNNER_TEMP/browser-determinism-${{ matrix.runtime }}.json"
      - name: Run the opt-in strict particle framebuffer oracle
        if: github.event_name == 'workflow_dispatch' && inputs.particle_render_oracle
        timeout-minutes: 5
        run: node --experimental-websocket tools/web-particle-render/run.mjs "$RUNNER_TEMP/web/wwwroot" --chrome /usr/bin/google-chrome --report "$RUNNER_TEMP/particle-render-${{ matrix.runtime }}.json"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-determinism-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/browser-determinism-${{ matrix.runtime }}.json
            ${{ runner.temp }}/particle-render-${{ matrix.runtime }}.json
          if-no-files-found: ignore
