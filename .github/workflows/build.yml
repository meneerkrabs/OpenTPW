name: Cross-platform build and CPU tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check fidelity annotation consistency
        run: |
          python tools/fidelity_register.py --check
          python -m unittest discover -s tools -p "test_fidelity_register.py" -v
          python -I -B tools/ppc-analysis/run_evidence_checks.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build source/OpenTPW.sln --configuration Release --nologo
      - run: dotnet test source/OpenTPW.Tests/OpenTPW.Tests.csproj --configuration Release --no-build --nologo
      - name: Check patch comparison tool
        run: dotnet run --project tools/patch-analysis/PatchAnalysis.csproj --configuration Release -- --self-test
  server-image:
    # Builds the self-hosting image, browser game included, and checks that it serves the page and the API.
    # It is also the only place CI compiles the browser build (OpenTPW.Web is not in the solution).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f source/OpenTPW.Server/Dockerfile -t opentpw-server .
      - name: Serve the page and the API from the image
        run: |
          docker run -d --name opentpw -p 127.0.0.1:8080:8080 opentpw-server
          for attempt in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/v1/server && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>OpenTPW</title>'
          curl -fsS -H 'Accept-Encoding: br' -o /dev/null -w '%{content_type} %header{content-encoding}\n' http://127.0.0.1:8080/_framework/dotnet.js
          docker logs opentpw
