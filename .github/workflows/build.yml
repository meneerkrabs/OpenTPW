name: Cross-platform build and CPU tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check fidelity annotation consistency
        run: |
          python tools/fidelity_register.py --check
          python -m unittest discover -s tools -p "test_fidelity_register.py" -v
          python -I -B tools/ppc-analysis/run_evidence_checks.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - run: dotnet build source/OpenTPW.sln --configuration Release --nologo
      - run: dotnet test source/OpenTPW.Tests/OpenTPW.Tests.csproj --configuration Release --no-build --nologo
      - name: Check patch comparison tool
        run: dotnet run --project tools/patch-analysis/PatchAnalysis.csproj --configuration Release -- --self-test
  server-image:
    # Builds the self-hosting image, browser game included, and checks that it serves the page and the API.
    # It is also the only place CI compiles the browser build (OpenTPW.Web is not in the solution).
    # Pushes from main and release tags publish it to ghcr.io (docs/SERVER.md); the official server
    # follows the latest release.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: docker build -f source/OpenTPW.Server/Dockerfile -t opentpw-server .
      - name: Serve the page and the API from the image
        run: |
          docker run -d --name opentpw -p 127.0.0.1:8080:8080 opentpw-server
          for attempt in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/v1/server && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>OpenTPW</title>'
          curl -fsS -H 'Accept-Encoding: br' -o /dev/null -w '%{content_type} %header{content-encoding}\n' http://127.0.0.1:8080/_framework/dotnet.js
          docker logs opentpw
      - name: Publish to GitHub Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image=ghcr.io/meneerkrabs/opentpw-server
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "$REF" = refs/heads/main ]; then tags="main"; else tags="$REF_NAME latest"; fi
          for tag in $tags; do
            docker tag opentpw-server "$image:$tag"
            docker push "$image:$tag"
          done
  deploy:
    # A release tag updates the official server once its image is published: the server's deploy route
    # leaves a request in its data folder, and the host's opentpw-deploy.path runs the regular update
    # (docs/SERVER.md, "Automatic deployment"). SSH stays closed to GitHub.
    needs: server-image
    if: github.repository == 'meneerkrabs/OpenTPW' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask play.opentpw.io to update
        env:
          DEPLOY_TOKEN: ${{ secrets.OPENTPW_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then echo "No OPENTPW_DEPLOY_TOKEN secret; skipping."; exit 0; fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" https://play.opentpw.io/api/v1/admin/deploy)
          case "$status" in
            202) echo "The server updates now." ;;
            # A server from before this route updates at night instead.
            404) echo "::warning::The server has no deploy route yet; the nightly update applies this release." ;;
            *) echo "::error::Deploy request failed with HTTP $status."; exit 1 ;;
          esac
