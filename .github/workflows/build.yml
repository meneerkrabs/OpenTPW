name: Cross-platform build and CPU tests
on:
  # Branches with a pull request are built by its pull_request run; a push builds only main and the release tags, so a PR push
  # no longer runs everything twice.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published stable release to deploy (for example v0.7.5); leave empty for a normal build'
        required: false
        default: ''
        type: string
permissions:
  contents: read
# A new push to a pull request cancels its older run; main and the release tags always finish.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    if: inputs.release_tag == ''
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Classify the complete pull request changeset
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci_change_scope.py
  proposal-docs:
    needs: changes
    if: inputs.release_tag == '' && needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check proposal documentation and register consistency
        run: |
          python tools/fidelity_register.py --check
          python tools/progress.py --check
          python -m unittest discover -s tools -p "test_ci_change_scope.py" -v
          python -m unittest discover -s tools -p "test_fidelity_register.py" -v
          python -m unittest discover -s tools -p "test_progress.py" -v
          # Website's existing PR job independently builds/checks all documentation links.
  dispatch-release:
    # The browser's Run workflow selector lists branches. Forward the entered release
    # to its immutable tag instead of deploying the selected branch's current sources.
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Validate and build the published release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Enter a published stable release such as v0.7.5.' >&2
            exit 1
          fi
          state=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then "preview" else "published" end')
          if [ "$state" != published ]; then
            echo 'The selected release must be published and not a preview.' >&2
            exit 1
          fi
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
  build:
    needs: changes
    if: always() && !cancelled() && inputs.release_tag == '' && needs.changes.outputs.docs_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check fidelity annotation consistency and the progress fragments
        shell: bash
        run: |
          python tools/fidelity_register.py --check
          python -m unittest discover -s tools -p "test_ci_change_scope.py" -v
          python -m unittest discover -s tools -p "test_fidelity_register.py" -v
          python tools/progress.py --check
          python -m unittest discover -s tools -p "test_progress.py" -v
          python -m unittest discover -s tools -p "test_release_train.py" -v
          python -m unittest discover -s tools -p "test_coop_join_timings.py" -v
          python -m unittest discover -s tools -p "test_check_release_natives.py" -v
          python -m unittest discover -s tools -p "test_hire_portrait_geometry_contract.py" -v
          python -m unittest discover -s tools -p "test_employee_live_portrait_contract.py" -v
          python -m unittest discover -s tools -p "test_employee_portrait_geometry_contract.py" -v
          python -m unittest discover -s tools -p "test_locator_visitor_contract.py" -v
          python -m unittest discover -s tools -p "test_visitor_info_arrow_contract.py" -v
          python -m unittest discover -s tools -p "test_visitor_live_portrait_contract.py" -v
          python -m unittest discover -s tools -p "test_visitor_circle_contract.py" -v
          python -m unittest discover -s tools -p "test_staff_role_order_contract.py" -v
          python -m unittest discover -s tools -p "test_staff_sprite_vm_contract.py" -v
          python -m unittest discover -s tools -p "test_map_repair_contract.py" -v
          python -m unittest discover -s tools -p "test_ride_static_contract.py" -v
          python -m unittest discover -s tools -p "test_happiness_gauge_contract.py" -v
          python -m unittest discover -s tools -p "test_native_statistics_history_contract.py" -v
          python -m unittest discover -s tools -p "test_tpi_statistics_history_contract.py" -v
          python -m unittest discover -s tools -p "test_tpi_arrival_ring_contract.py" -v
          python -m unittest discover -s tools -p "test_graph_backdrop_contract.py" -v
          python -I -B tools/ppc-analysis/run_evidence_checks.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - run: dotnet build source/OpenTPW.sln --configuration Release --nologo
      - run: dotnet test source/OpenTPW.Tests/OpenTPW.Tests.csproj --configuration Release --no-build --nologo
      - name: Check patch comparison tool
        run: dotnet run --project tools/patch-analysis/PatchAnalysis.csproj --configuration Release -- --self-test
      - name: Check the browser page helpers, the kept game files, the performance harness and the live co-op driver
        run: node --test tools/test_web_perf.mjs tools/test_web_determinism.mjs tools/test_web_originals.mjs tools/test_web_cdimage.mjs tools/test_web_startup.mjs tools/test_web_inputs.mjs tools/test_web_pool_sprites.mjs tools/test_web_text.mjs tools/test_coop_live.mjs
  server-image:
    needs: changes
    # Builds the self-hosting image, browser game included, and checks that it serves the page and the API.
    # It is also the only place CI compiles the browser build (OpenTPW.Web is not in the solution).
    # Pushes from main and release tags publish it to ghcr.io (docs/SERVER.md); the official server
    # follows the latest release.
    if: always() && !cancelled() && inputs.release_tag == '' && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # A pull request compiles the browser page for the interpreter: the AOT compile alone takes about six of the job's seven
      # minutes. main and the release tags, whose images are published, keep the AOT build, so an AOT-only failure shows there.
      - run: docker build --build-arg BUILD_REVISION="${{ github.sha }}" --build-arg WEB_AOT=${{ github.event_name == 'pull_request' && 'false' || 'true' }} -f source/OpenTPW.Server/Dockerfile -t opentpw-server .
      - name: Serve the page and the API from the image
        run: |
          docker run -d --name opentpw -p 127.0.0.1:8080:8080 opentpw-server
          for attempt in $(seq 30); do curl -fsS http://127.0.0.1:8080/api/v1/server && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>OpenTPW</title>'
          curl -fsS -H 'Accept-Encoding: br' -o /dev/null -w '%{content_type} %header{content-encoding}\n' http://127.0.0.1:8080/_framework/dotnet.js
          # The pools sprite files (docs/POOLS.md, "Browser delivery") are served as static files: one of each extension must come back with its pinned size and SHA-256.
          for sprite in Swim/SPR_KI.ESP Swim/SPR_KI.TPC Generic/Kids/SPR_BE.TPC; do
            want_size=$(jq -r --arg p "$sprite" '.files[] | select(.path == $p) | .size' content/pools/esprites.manifest.json)
            want_hash=$(jq -r --arg p "$sprite" '.files[] | select(.path == $p) | .sha256' content/pools/esprites.manifest.json)
            curl -fsS -H 'Accept-Encoding: br' --compressed -o "$RUNNER_TEMP/sprite" "http://127.0.0.1:8080/pools-sprites/$sprite"
            [ "$(wc -c < "$RUNNER_TEMP/sprite")" = "$want_size" ] || { echo "::error::$sprite has the wrong size"; exit 1; }
            [ "$(sha256sum "$RUNNER_TEMP/sprite" | cut -d' ' -f1)" = "$want_hash" ] || { echo "::error::$sprite has the wrong SHA-256"; exit 1; }
          done
          docker logs opentpw
      - name: Run postcard regression checks in the published browser runtime
        run: node --experimental-websocket tools/web-postcard-smoke.mjs http://127.0.0.1:8080
      - name: Publish to GitHub Container Registry
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image=ghcr.io/meneerkrabs/opentpw-server
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "$REF" = refs/heads/main ]; then tags="main"; else tags="$REF_NAME latest"; fi
          for tag in $tags; do
            docker tag opentpw-server "$image:$tag"
            docker push "$image:$tag"
          done
  deploy:
    # A release tag updates the official server once its image is published: the server's deploy route
    # leaves a request in its data folder, and the host's opentpw-deploy.path runs the regular update
    # (docs/SERVER.md, "Automatic deployment"). SSH stays closed to GitHub.
    needs: [build, server-image]
    if: github.repository == 'meneerkrabs/OpenTPW' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask play.opentpw.io to update
        env:
          DEPLOY_TOKEN: ${{ secrets.OPENTPW_DEPLOY_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then echo "No OPENTPW_DEPLOY_TOKEN secret; skipping."; exit 0; fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $DEPLOY_TOKEN" https://play.opentpw.io/api/v1/admin/deploy)
          case "$status" in
            202) echo "The server updates now." ;;
            # A server from before this route updates at night instead.
            404) echo "::warning::The server has no deploy route yet; the nightly update applies this release." ;;
            *) echo "::error::Deploy request failed with HTTP $status."; exit 1 ;;
          esac
