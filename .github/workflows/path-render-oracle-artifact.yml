name: Synthetic path diagnostic artifact
# Separate from Browser determinism so an artifact-only dispatch does not launch its browsers/AOT build.
# No automatic trigger. Normal PR/push gates and their workflow are unchanged.
on:
  workflow_dispatch:
    inputs:
      build_artifact:
        description: "Build and audit the synthetic path artifact only (no browser)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  path-oracle-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.build_artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require the reviewed diagnostic candidate ref (bootstrap main may contain workflow only)
        run: |
          test -f source/OpenTPW.Web/Program.PathRenderOracle.cs
          test -f tools/web-path-render/stage.py
          test -f tools/PathOracleAudit/selftest.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - name: Check diagnostic contracts and artifact rejection cases (no browser)
        run: |
          node --test tools/web-path-render/assertions.test.mjs
          python3 -m unittest discover -s tools/web-path-render -p 'test_stage.py' -v
      - name: Publish only the isolated interpreter diagnostic
        run: |
          test ! -e "$RUNNER_TEMP/path-oracle-build"
          test ! -e "$RUNNER_TEMP/path-oracle-publish"
          dotnet publish source/OpenTPW.Web/OpenTPW.Web.csproj -c Release --nologo \
            --artifacts-path "$RUNNER_TEMP/path-oracle-build" -o "$RUNNER_TEMP/path-oracle-publish" \
            -p:OpenTpwPathRenderOracle=true -p:OpenTpwDeterminismPins=false \
            -p:UseMonoRuntime=true -p:RunAOTCompilation=false -p:WasmBuildNative=false \
            -p:WasmEnableWebcil=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false \
            -p:PathOracleAuditDirectory="$RUNNER_TEMP/path-oracle-inputs"
      - name: Qualify and run the final PE inspector (no fixture assembly execution)
        run: |
          dotnet build tools/PathOracleAudit/PathOracleAudit.csproj -c Release --nologo \
            --artifacts-path "$RUNNER_TEMP/path-oracle-auditor-build" -o "$RUNNER_TEMP/path-oracle-auditor"
          python3 tools/PathOracleAudit/selftest.py \
            --auditor "$RUNNER_TEMP/path-oracle-auditor/PathOracleAudit.dll" \
            --repository-root "$GITHUB_WORKSPACE" --work-root "$RUNNER_TEMP/path-oracle-pe-fixtures"
          dotnet "$RUNNER_TEMP/path-oracle-auditor/PathOracleAudit.dll" \
            --web-root "$RUNNER_TEMP/path-oracle-publish/wwwroot" --repository-root "$GITHUB_WORKSPACE" \
            --allowlist "$GITHUB_WORKSPACE/tools/web-path-render/artifact-allowlist.json" \
            --output "$RUNNER_TEMP/path-oracle-pe-audit.json"
      - name: Stage only audited boot closure and synthetic driver
        run: |
          python3 tools/web-path-render/stage.py \
            --repository-root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA" \
            --web-root "$RUNNER_TEMP/path-oracle-publish/wwwroot" \
            --inputs "$RUNNER_TEMP/path-oracle-inputs" --build-root "$RUNNER_TEMP/path-oracle-build" \
            --pe-report "$RUNNER_TEMP/path-oracle-pe-audit.json" \
            --runtime-root "$DOTNET_ROOT" --runtime-root "$HOME/.nuget/packages" \
            --output "$RUNNER_TEMP/path-oracle-verified"
      - name: Keep only the verified shader and synthetic diagnostic artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: path-render-oracle-interpreter-${{ github.sha }}
          path: ${{ runner.temp }}/path-oracle-verified
          if-no-files-found: error
          retention-days: 7
