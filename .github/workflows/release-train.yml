name: Hourly release
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what the train would release; start nothing'
        default: true
        type: boolean
# Two trains never overlap; a later train waits for the running one instead of cancelling it.
concurrency:
  group: release-train
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  train:
    # The scheduled run belongs to the default branch; ignore forks, which have no releases to publish.
    if: github.repository == 'meneerkrabs/OpenTPW'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # read the build runs and start Release builds (a tag pushed by GITHUB_TOKEN would start nothing)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B tools/release_train.py --notes-file "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/plan.json"
          {
            echo "action=$(jq -r .action "$RUNNER_TEMP/plan.json")"
            echo "version=$(jq -r .version "$RUNNER_TEMP/plan.json")"
            echo "commit=$(jq -r .commit "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Hourly release'
            echo
            echo "Main at \`$(jq -r .commit "$RUNNER_TEMP/plan.json")\`: **$(jq -r .action "$RUNNER_TEMP/plan.json")**"
            echo
            jq -r .reason "$RUNNER_TEMP/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the release
        if: ${{ steps.plan.outputs.action == 'release' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          # Right before dispatching, fetch the tags again and plan again: another release may have been
          # tagged since the plan above. Only go on when the new plan names the same version and commit.
          git fetch --tags --force origin
          python -B tools/release_train.py --notes-file "$RUNNER_TEMP/notes-recheck.md" > "$RUNNER_TEMP/recheck.json"
          if [[ "$(jq -r .action "$RUNNER_TEMP/recheck.json")" != release \
                || "$(jq -r .version "$RUNNER_TEMP/recheck.json")" != "$VERSION" \
                || "$(jq -r .commit "$RUNNER_TEMP/recheck.json")" != "$COMMIT" ]]; then
            echo "The plan changed before dispatch; starting nothing. The next train decides again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The commit input pins the build and the tag to the exact commit that was checked above,
          # even if main moves before the build starts. Stable (not a pre-release): becomes the latest download.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$VERSION" -f prerelease=false -f commit="$COMMIT" -F notes=@"$RUNNER_TEMP/notes.md"
          echo "Started release $VERSION from $COMMIT." >> "$GITHUB_STEP_SUMMARY"
      - name: Dry run note
        if: ${{ steps.plan.outputs.action == 'release' && inputs.dry_run == true }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: echo "Dry run, would release $VERSION from $COMMIT." >> "$GITHUB_STEP_SUMMARY"
