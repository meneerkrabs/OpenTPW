name: Hourly release
on:
  # CI completion is the primary wake-up; cron is a best-effort recovery path.
  workflow_run:
    workflows: [Cross-platform build and CPU tests]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only report what the train would release; start nothing'
        default: true
        type: boolean
      wait_for_release_run:
        description: 'Internal catch-up: wait for this Release builds run to finish successfully'
        default: ''
        type: string
# Two trains never overlap; a later train waits for the running one instead of cancelling it.
concurrency:
  group: release-train
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  train:
    # The scheduled run belongs to the default branch; ignore forks, which have no releases to publish.
    if: >-
      github.repository == 'meneerkrabs/OpenTPW' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # read the build runs and start Release builds (a tag pushed by GITHUB_TOKEN would start nothing)
    steps:
      - name: Wait for the completed release
        if: inputs.wait_for_release_run != ''
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.wait_for_release_run }}
        run: |
          # Explicit dispatch works with GITHUB_TOKEN; its downstream workflow_run event may be suppressed.
          # The source dispatch returns before its own final cleanup, so wait without holding up the source.
          if [[ ! "$RELEASE_RUN" =~ ^[0-9]+$ ]]; then
            echo 'The catch-up source must be a numeric release run ID.' >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > "$RUNNER_TEMP/source-release.json"
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .path == ".github/workflows/release.yml" and .event == "workflow_dispatch" and
            .head_branch == "main" and .repository.full_name == $repo
          ' "$RUNNER_TEMP/source-release.json" > /dev/null
          for attempt in $(seq 30); do
            if [[ "$(jq -r .status "$RUNNER_TEMP/source-release.json")" == completed ]]; then
              jq -e '.conclusion == "success"' "$RUNNER_TEMP/source-release.json" > /dev/null
              exit 0
            fi
            sleep 5
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" > "$RUNNER_TEMP/source-release.json"
          done
          echo 'The source release did not complete within the catch-up wait; starting nothing.' >&2
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B tools/release_train.py --notes-file "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/plan.json"
          {
            echo "action=$(jq -r .action "$RUNNER_TEMP/plan.json")"
            echo "version=$(jq -r .version "$RUNNER_TEMP/plan.json")"
            echo "commit=$(jq -r .commit "$RUNNER_TEMP/plan.json")"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### Hourly release'
            echo
            echo "Main at \`$(jq -r .commit "$RUNNER_TEMP/plan.json")\`: **$(jq -r .action "$RUNNER_TEMP/plan.json")**"
            echo
            jq -r .reason "$RUNNER_TEMP/plan.json"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start the release
        if: ${{ steps.plan.outputs.action == 'release' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          # Right before dispatching, fetch the tags again and plan again: another release may have been
          # tagged or main may have moved since the plan above. Only go on when the new plan names the same version and commit.
          git fetch --tags origin +refs/heads/main:refs/remotes/origin/main
          python -B tools/release_train.py --head "$(git rev-parse refs/remotes/origin/main)" --notes-file "$RUNNER_TEMP/notes-recheck.md" > "$RUNNER_TEMP/recheck.json"
          if [[ "$(jq -r .action "$RUNNER_TEMP/recheck.json")" != release \
                || "$(jq -r .version "$RUNNER_TEMP/recheck.json")" != "$VERSION" \
                || "$(jq -r .commit "$RUNNER_TEMP/recheck.json")" != "$COMMIT" ]]; then
            echo "The plan changed before dispatch; starting nothing. The next train decides again." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The commit input pins the build and the tag to the exact commit that was checked above,
          # even if main moves before the build starts. Stable (not a pre-release): becomes the latest download.
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f version="$VERSION" -f prerelease=false -f commit="$COMMIT" -F notes=@"$RUNNER_TEMP/notes.md"
          echo "Started release $VERSION from $COMMIT." >> "$GITHUB_STEP_SUMMARY"
      - name: Dry run note
        if: ${{ steps.plan.outputs.action == 'release' && inputs.dry_run == true }}
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          COMMIT: ${{ steps.plan.outputs.commit }}
        run: echo "Dry run, would release $VERSION from $COMMIT." >> "$GITHUB_STEP_SUMMARY"
