name: Release builds
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v0.7.2)'
        required: true
        type: string
      prerelease:
        description: 'Mark as preview (not the latest download)'
        default: false
        type: boolean
      commit:
        description: 'Optional full commit SHA on main to build and tag (default: the selected ref). Used by the hourly preview train.'
        required: false
        default: ''
        type: string
      notes:
        description: 'Optional extra release notes, added to the generated list of merged pull requests'
        required: false
        default: ''
        type: string
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PREVIEW: ${{ inputs.prerelease }}
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          commit="${REQUESTED_COMMIT:-$GITHUB_SHA}"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The commit must be a full lowercase SHA.' >&2
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          version="${REQUESTED_VERSION:-$GITHUB_REF_NAME}"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo 'Use a version such as v0.7.2 or v0.7.2-preview.1.' >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          preview="${PREVIEW:-false}"
          if [[ "$version" == *-* ]]; then preview=true; fi
          echo "prerelease=$preview" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.version.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      # Every job below runs code from this commit (the native build scripts, the publish), so only a commit on main is built:
      # a dispatch from another branch, a requested commit or a tag on an unmerged commit is refused before any of it runs.
      - name: Require the commit to be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo 'The commit to build is not on main.' >&2; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test release publication safeguards
        run: |
          python -I tools/test_publish_release.py
          python -I tools/test_check_release_natives.py
  natives:
    needs: configure
    # Source builds of the pinned native libraries the NuGet packages lack for these runtimes, plus SDL2 for win-x64/win-x86,
    # where Veldrid.SDL2 carries SDL 2.0.8 (its WASAPI output drops audio, issue #754; docs/RELEASES.md).
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
            libraries: veldrid-spirv sdl2
          - rid: win-arm64
            os: windows-11-arm
            libraries: veldrid-spirv cimgui sdl2
          - rid: win-x64
            os: windows-latest
            libraries: sdl2
          - rid: win-x86
            os: windows-latest
            libraries: sdl2
          - rid: linux-arm64
            os: ubuntu-22.04-arm
            libraries: veldrid-spirv cimgui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.configure.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build native libraries
        shell: bash
        run: python scripts/build-native.py --rid ${{ matrix.rid }} --cache-dir "$RUNNER_TEMP/native-sources" --jobs 4 ${{ matrix.libraries }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}
          if-no-files-found: error

  publish:
    needs: [configure, natives]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-latest, native: true }
          - { rid: win-arm64, os: windows-latest, native: true }
          - { rid: win-x64, os: windows-latest, native: true }
          - { rid: win-x86, os: windows-latest, native: true }
          - { rid: linux-x64, os: ubuntu-22.04, native: false }
          - { rid: linux-arm64, os: ubuntu-22.04, native: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.configure.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - if: ${{ matrix.native }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}
      - name: Publish
        shell: bash
        run: |
          dotnet publish source/OpenTPW/OpenTPW.csproj --configuration Release --runtime ${{ matrix.rid }} \
            --self-contained true --nologo --output "publish/OpenTPW-${{ matrix.rid }}"
          cp README.md LICENSE.md docs/RELEASES.md "publish/OpenTPW-${{ matrix.rid }}/"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      # A Windows folder must hold exactly one SDL2.dll, no older than the source pin (never the package's 2.0.8).
      - name: Check bundled native libraries
        shell: bash
        run: python -I tools/check_release_natives.py --rid ${{ matrix.rid }} "publish/OpenTPW-${{ matrix.rid }}"
      - name: Archive (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: Compress-Archive -Path "publish/OpenTPW-${{ matrix.rid }}" -DestinationPath "OpenTPW-${{ matrix.rid }}.zip"
      - name: Archive (macOS, Linux)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          chmod +x "publish/OpenTPW-${{ matrix.rid }}/OpenTPW"
          tar -C publish -czf "OpenTPW-${{ matrix.rid }}.tar.gz" "OpenTPW-${{ matrix.rid }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: OpenTPW-${{ matrix.rid }}
          path: OpenTPW-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    needs: [configure, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.configure.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: OpenTPW-*
          merge-multiple: true
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.configure.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.configure.outputs.prerelease }}
          RELEASE_COMMIT: ${{ needs.configure.outputs.commit }}
          RELEASE_EXTRA_NOTES: ${{ inputs.notes }}
        run: bash scripts/publish-release.sh release
      # A tag created by GITHUB_TOKEN does not trigger push workflows. Dispatch the exact
      # published tag explicitly; ordinary tag pushes already have their own image/deploy run.
      - name: Build and deploy the published server release
        if: github.event_name == 'workflow_dispatch' && needs.configure.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.configure.outputs.version }}
        run: gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_VERSION"
      # Explicitly wake the train: workflow_run can be suppressed for a GITHUB_TOKEN-dispatched release.
      # The train waits for this exact run to finish, then applies its normal fresh-main/CI/active-run gates.
      - name: Reconsider green main after this release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.configure.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-train.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f dry_run=false -f wait_for_release_run="$GITHUB_RUN_ID"
