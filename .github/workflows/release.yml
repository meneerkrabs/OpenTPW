name: Release builds
on:
  push:
    tags: ['v*']
    # Temporary: lets the pipeline run while it is developed on this branch.
    branches: [release-ci]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  natives:
    # Source builds of the pinned native libraries the NuGet packages lack for these runtimes.
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            os: macos-latest
            libraries: veldrid-spirv sdl2
          - rid: win-arm64
            os: windows-11-arm
            libraries: veldrid-spirv cimgui sdl2
          - rid: linux-arm64
            os: ubuntu-22.04-arm
            libraries: veldrid-spirv cimgui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build native libraries
        shell: bash
        run: python scripts/build-native.py --rid ${{ matrix.rid }} --cache-dir "$RUNNER_TEMP/native-sources" --jobs 4 ${{ matrix.libraries }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}
          if-no-files-found: error

  publish:
    needs: natives
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: osx-arm64, os: macos-latest, native: true }
          - { rid: win-arm64, os: windows-latest, native: true }
          - { rid: win-x64, os: windows-latest, native: false }
          - { rid: win-x86, os: windows-latest, native: false }
          - { rid: linux-x64, os: ubuntu-22.04, native: false }
          - { rid: linux-arm64, os: ubuntu-22.04, native: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json
      - if: ${{ matrix.native }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-${{ matrix.rid }}
          path: native/${{ matrix.rid }}
      - name: Publish
        shell: bash
        run: |
          dotnet publish source/OpenTPW/OpenTPW.csproj --configuration Release --runtime ${{ matrix.rid }} \
            --self-contained true --nologo --output "publish/OpenTPW-${{ matrix.rid }}"
          cp README.md LICENSE.md docs/RELEASES.md "publish/OpenTPW-${{ matrix.rid }}/"
      - name: Archive (Windows)
        if: ${{ startsWith(matrix.rid, 'win-') }}
        shell: pwsh
        run: Compress-Archive -Path "publish/OpenTPW-${{ matrix.rid }}" -DestinationPath "OpenTPW-${{ matrix.rid }}.zip"
      - name: Archive (macOS, Linux)
        if: ${{ !startsWith(matrix.rid, 'win-') }}
        shell: bash
        run: |
          chmod +x "publish/OpenTPW-${{ matrix.rid }}/OpenTPW"
          tar -C publish -czf "OpenTPW-${{ matrix.rid }}.tar.gz" "OpenTPW-${{ matrix.rid }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: OpenTPW-${{ matrix.rid }}
          path: OpenTPW-${{ matrix.rid }}.*
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: OpenTPW-*
          merge-multiple: true
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "OpenTPW $GITHUB_REF_NAME" --generate-notes --prerelease
