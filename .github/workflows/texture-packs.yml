name: Publish texture assets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: texture-assets
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify distribution tooling
        run: |
          python3 -I -B tools/test_package_texture_pack.py
          python3 -I -B tools/test_stage_texture_pages.py
      - name: Prepare verified static textures
        run: |
          python3 -I -B tools/stage_texture_pages.py \
            --index content/texture-packs/clarity-enhanced/distribution.json \
            --checksum content/texture-packs/clarity-enhanced/distribution.sha256 \
            --out out/texture-pages --cache "$RUNNER_TEMP/texture-downloads"
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d28e3f532f4489d9fc27a4e1baff1fe4
          command: pages deploy out/texture-pages --project-name=opentpw-textures --branch=main --commit-dirty=true
