name: Website
# Publishes website/ to Cloudflare Pages (project "opentpw", served at opentpw.io).
# Needs the repository secret CLOUDFLARE_API_TOKEN, a token limited to Cloudflare Pages: Edit.
# Pull requests validate the generated pages; only main deploys. The fidelity register is generated here from the
# source annotations (it is not committed), so source changes rebuild the site too.
on:
  push:
    branches: [main]
    paths: ['website/**', 'docs/**', 'README.md', 'source/**/*.cs', 'tools/fidelity_register.py', 'tools/fidelity_retired.txt', 'LICENSE.md', 'tools/**/*.md', 'tools/site_docs.py', 'tools/test_site_docs.py', 'tools/site_status.py', 'tools/site_status_curated.json', 'tools/test_site_status.py', 'tools/check_site.py', 'tools/test_check_site.py', '.github/workflows/website.yml']
  pull_request:
    paths: ['website/**', 'docs/**', 'README.md', 'source/**/*.cs', 'tools/fidelity_register.py', 'tools/fidelity_retired.txt', 'LICENSE.md', 'tools/**/*.md', 'tools/site_docs.py', 'tools/test_site_docs.py', 'tools/site_status.py', 'tools/site_status_curated.json', 'tools/test_site_status.py', 'tools/check_site.py', 'tools/test_check_site.py', '.github/workflows/website.yml']
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test and build the static documentation
        run: |
          python3 -I -B tools/fidelity_register.py --write
          python3 -I -B tools/test_site_docs.py
          python3 -I -B tools/test_check_site.py
          python3 -I -B tools/test_site_status.py
          python3 -I -B tools/site_docs.py
      - name: Generate the live status page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The latest merged pull requests; without them (forks, API trouble) the generator reads the git history.
          gh api "repos/${{ github.repository }}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=50" > "$RUNNER_TEMP/pulls.json" || echo "::notice::GitHub API unavailable; recent progress comes from git history."
          python3 -I -B tools/site_status.py --pulls-json "$RUNNER_TEMP/pulls.json"
      - name: Check links and anchors
        run: python3 -I -B tools/check_site.py
  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check for the Cloudflare token
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "::notice::CLOUDFLARE_API_TOKEN is not set; the website is not deployed."; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.token.outputs.present == 'true'
        with:
          python-version: '3.12'
      - name: Build the static documentation
        if: steps.token.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I -B tools/fidelity_register.py --write
          python3 -I -B tools/site_docs.py
          gh api "repos/${{ github.repository }}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=50" > "$RUNNER_TEMP/pulls.json" || echo "::notice::GitHub API unavailable; recent progress comes from git history."
          python3 -I -B tools/site_status.py --pulls-json "$RUNNER_TEMP/pulls.json"
          python3 -I -B tools/check_site.py
      - if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d28e3f532f4489d9fc27a4e1baff1fe4
          command: pages deploy website --project-name=opentpw --branch=main --commit-dirty=true
