# Producer inventory of the 351 advisor messages of Sim Theme Park World (Windows v2.0), for interoperability: for every
# descriptor of the table at 0x76E300 of tp.exe (content/data/advisor-descriptors.toml) the code that produces it, the
# inputs it reads, its OpenTPW status and a batch for implementation. Traced by hand from tp.exe
# (SHA-256 5472f97b5eb28f58b5a49f3a15f6f66adffa6b2625a623f503202c9696d1b805); see docs/reverse/ADVISOR-SCAN.md.
#
# message: message ID (the descriptor index; every ID 0-350 appears once);
# kind: scan (the background scan 0x59C680 scores it from park state), scan-zero (the scan reaches it but its callback is the
#   constant-zero stub 0x5D60C0), event (game code posts it), help (a window or tool posts it, score callback 0x59E8C0),
#   unused (nothing in tp.exe produces it);
# batch: money, cleanliness, rides, queues_prices, guest_mood, staff, research, weather, challenges, tutorial or other;
# status: wired (OpenTPW produces it), ready (every input exists in OpenTPW), blocked (an input is missing, see tags) or none
#   (nothing to produce: scan-zero and unused);
# producer: the scan callback or the address of the posting code; score: the Advisor.sam keys the score callback reads;
# inputs: tags into the tags array; formula: the score condition and formula in words; captions: the TAG_SYSTEM.str entries
#   (0-based) of the responses' captions (none: the message is speech only); orphans: TAG_SYSTEM.str entries no response
#   references that read as this message's text (matched by wording and position, inferred); sample / local: the first response's speech
#   sample and whether it is the level bank (advisor-responses.toml); restored (optional): the topic of the opentpw.restored-advice
#   extension that wires the row (RestoredAdvice.Entries, docs/reverse/ADVISOR-SCAN.md "Restored advice"); it never changes the row's status,
#   which stays what tp.exe v2.0 does. The caption texts and Advisor.sam values are game data and are not copied here.

