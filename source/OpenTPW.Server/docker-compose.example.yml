# Example: OPENTPW_DOMAIN=tpw.example.org docker compose -f source/OpenTPW.Server/docker-compose.example.yml up -d --build
# (run from the repository root). Point the domain's DNS at this machine first: Caddy answers on
# ports 80 and 443 and gets the HTTPS certificate itself. The game, the API and the chat are then
# all at https://tpw.example.org/ (docs/SERVER.md).
services:
  opentpw-server:
    build:
      context: ../..
      dockerfile: source/OpenTPW.Server/Dockerfile
    restart: unless-stopped
    # Reachable only through Caddy; nothing listens on the host for it.
    expose:
      - "8080"
    environment:
      OpenTPW__ServerName: "My OpenTPW server"
      OpenTPW__Message: "Welcome! Be nice."
      # Behind Caddy, let rate limits see real client addresses:
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      # Optional word filter from YOUR OWN game installation (never shipped with the server):
      # OpenTPW__FilterDirectory: /game-language
    volumes:
      - opentpw-data:/data
      # - "/path/to/Theme Park World/Data/Language/English:/game-language:ro"
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OPENTPW_DOMAIN: ${OPENTPW_DOMAIN:?Set OPENTPW_DOMAIN to the server's domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - opentpw-server
volumes:
  opentpw-data:
  caddy-data:
  caddy-config:
