# 77ea0c41410aad7c94a5eda658e31cb4ac05f7253aaf6746ad5e8a90afbd967a), for interoperability: for every message id of the
# descriptor table at 0x9DE020 (content/data/tpi-advisor-descriptors.toml), in ascending id order, the code that
# produces it and its OpenTPW status. Read statically from the executable; see docs/reverse/TPI-ADVISOR.md section 9.
# Test data of ThemeParkIncAdvisorProducerTests: OpenTPW does not read it at run time, so it is not shipped.
#
# message: the message id; every id with a descriptor row appears once.
# kind: scan (the condition scan 0x71C0B0 evaluates one of its rows), scan-zero (its scan callback is a constant 0),
#   event (game code posts it through the record constructor 0x71A930, the enqueue 0x718820 or the advisor's message
#   handler), help (a window or panel posts it through 0x503A40, 0x503AD0 or 0x5039F0), unused (nothing in the
#   executable was found to post it).
# status: wired (OpenTPW posts it as the original does), gated (the original posts it but OpenTPW does not yet; the
#   reason is in producer, under [EXT:tpi-capability-gates]) or none (scan-zero and unused: nothing to post).
# evidence: traced (the posting site was read: the id is the argument a poster pushes, or a table it indexes) or
#   searched (no poster was found: no immediate of the id reaches 0x71A930, 0x718820, 0x503A40, 0x503AD0 or 0x5039F0
#   as their argument, no handler case and no table of the challenge or mission code names it; a register-argument
#   site that reads another table could still post it).
# producer: the posting sites (addresses of the calls and of the pushes), the cancels (0x718990, 0x503B40) and, for a
#   gated row, why OpenTPW does not post it.

