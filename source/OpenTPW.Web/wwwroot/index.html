<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTPW web spike</title>
<style>
	body { font-family: system-ui, sans-serif; background: #1b2633; color: #e8eef5; margin: 16px; }
	h1 { font-size: 20px; }
	#status { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; background: #0f1720; padding: 8px; max-height: 160px; overflow: auto; }
	.row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-top: 12px; }
	canvas { background: #000; border: 1px solid #456; }
	figure { margin: 0; } figcaption { font-size: 12px; color: #9ab; }
</style>
</head>
<body>
<h1>OpenTPW in the browser (feasibility spike)</h1>
<p>Choose your own Theme Park World folder (the one that contains <code>Data</code>). Only a few files are read, inside this page; nothing is uploaded.</p>
<input type="file" id="folder" webkitdirectory directory multiple>
<div id="status">Loading the .NET runtime…</div>
<div class="row">
	<figure><canvas id="map" width="512" height="512"></canvas><figcaption>Jungle attribute map (base.map), coloured by cell flags</figcaption></figure>
	<figure><canvas id="terrain" width="512" height="512"></canvas><figcaption>Jungle terrain (base.MD2), WebGL</figcaption></figure>
	<figure><canvas id="ride" width="384" height="384"></canvas><figcaption>Totem ride (totem.MD2), WebGL</figcaption></figure>
	<figure><canvas id="texture" width="256" height="256"></canvas><figcaption>Path texture (grd_pav1.wct)</figcaption></figure>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
