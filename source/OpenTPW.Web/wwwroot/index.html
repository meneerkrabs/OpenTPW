<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTPW</title>
<style>
	:root { color-scheme: dark; }
	html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 15px system-ui, sans-serif; }
	#canvas { display: block; width: 100vw; height: 100vh; outline: none; }
	#setup { position: fixed; inset: 0; display: grid; place-content: center; gap: 12px; padding: 16px; text-align: center; background: #101418; }
	#setup[hidden] { display: none; }
	#status { min-height: 1.4em; color: #9ab; }
	label { display: inline-block; padding: 10px 18px; border-radius: 8px; background: #3b4cc0; color: #fff; cursor: pointer; }
	input { display: none; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="setup">
	<h1>OpenTPW</h1>
	<p>Choose your own Theme Park World folder (the one that holds <code>Data</code>).<br>The files stay in this browser; nothing is uploaded.</p>
	<p><label>Choose folder<input type="file" id="folder" webkitdirectory directory multiple></label></p>
	<p id="status">Starting…</p>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
